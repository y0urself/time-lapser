name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: greenbone/actions/uv@f9e65dccc0cf6f336feaed809a005e6121f67a5a # main, 2026-10-31
        with:
          python-version: "3.12"
          uv-version: "0.13.4"
          cache-dependency-glob: uv.lock
      - name: Install locked development dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Build wheel and source distribution
        run: uv build
      - name: Check installed wheel outside the source import path
        run: |
          uv venv .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          .wheel-venv/bin/python -I -m castlestube_cleanup --version
          .wheel-venv/bin/castlestube-cleanup --help

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: greenbone/actions/uv@f9e65dccc0cf6f336feaed809a005e6121f67a5a # main, 2026-10-31
        with:
          python-version: ${{ matrix.python }}
          uv-version: "0.13.4"
          cache-dependency-glob: uv.lock
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --no-progress --yes
      - name: Check video tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Install locked development dependencies
        run: uv sync --locked
      - name: Unit and synthetic video tests with coverage
        run: uv run --locked coverage run -m unittest discover -v
      - name: Coverage report
        run: uv run --locked coverage report
